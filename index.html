<!DOCTYPE html>

<head>

    <style>

        .signature-buttons {

        .leaderboard .clear-btn {

            border: none;

        .leaderboard-list {

        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f8faff;
            border-radius: 12px;
            padding: 8px 14px;

        }
        .leaderboard-item .signature-img {

            height: 30px;
            border: 1px solid #ccc;

        .leaderboard-item .info {
            flex: 1;

        .leaderboard-item .info .title {

    </style>
</head>
<body>

<!-- 主界面 -->
<div class="container active" id="mainMenu">
    <h1>🧩 欢迎来到连线挑战！</h1>
    <p>三关单词配对 · 测试你的词汇与速度</p>
    <button class="btn-start" id="startBtn">🚀 开始</button>
</div>

<!-- 选关界面 -->
<div class="container" id="levelSelect">
    <h2>📚 选择单元</h2>
    <div id="unitGrid"></div>
    <div style="text-align:center; margin-top:20px;">
        <button class="back-btn" id="backFromSelect">← 返回主界面</button>
    </div>
</div>

<!-- 游戏界面 -->
<div class="container game-container" id="gameContainer">
    <button class="back-to-menu" id="backFromGame">← 返回主界面</button>
    <h1>
        <span>🧩 单词连线</span>
        <span class="level-badge" id="levelBadge">第 1 / 3 关</span>
    </h1>
    <div class="subhead" id="levelDesc">左侧英文 ↔ 右侧中文</div>

    <div class="game-area" id="gameArea">
        <div class="column" id="leftCol"></div>
        <div class="column right" id="rightCol"></div>
        <svg class="svg-overlay" id="svgOverlay"></svg>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="checkBtn">✅ 检查</button>
        <button class="btn btn-success" id="nextBtn" disabled>▶ 下一关</button>
    </div>
    <div class="message" id="message">💡 从左侧拖拽到右侧配对</div>
</div>

<canvas id="celebrationCanvas"></canvas>

<script>
    (function() {
        // ================================================================
        // 🔥 在这里填入您的 Firebase 配置
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCSFLnjhJaZCP27qOgf3OCsUnOj4kj5d6M",
            authDomain: "wordmatchleaderboard.firebaseapp.com",
            databaseURL: "请替换为您的 databaseURL",
            projectId: "wordmatchleaderboard",
            storageBucket: "wordmatchleaderboard.firebasestorage.app",
            messagingSenderId: "645489345901",
            appId: "1:645489345901:web:0c87cd0aa0ac0252014664"
        };

        // 初始化 Firebase
        let firebaseInitialized = false;
        let database = null;

        function initFirebase() {
            if (firebaseInitialized) return;
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseInitialized = true;
                console.log('Firebase 初始化成功');
            } catch (e) {
                console.warn('Firebase 初始化失败，使用本地存储备用', e);
                // 回退到 localStorage
            }
        }
        // 延迟初始化，不影响页面加载
        setTimeout(initFirebase, 500);

        // ================================================================
        // 1. 音频工具 (所有交互都有音效)
        // ================================================================
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playBubbleSound(volume = 0.3, pitch = 800, duration = 0.12) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, ctx.currentTime + duration);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) { /* 静默失败 */ }
        }

        // 为不同交互定义音效
        function soundClick() { playBubbleSound(0.25, 700, 0.1); }        // 普通按钮点击
        function soundStart() { playBubbleSound(0.35, 1000, 0.15); }      // 开始按钮
        function soundBack() { playBubbleSound(0.25, 550, 0.12); }        // 返回
        function soundDrag() { playBubbleSound(0.2, 600, 0.08); }
        function soundMatch() { playBubbleSound(0.35, 900, 0.15); }
        function soundWrong() { playBubbleSound(0.3, 300, 0.2); }
        function soundCheck() { playBubbleSound(0.3, 1200, 0.1); }
        function soundNext() { playBubbleSound(0.4, 1500, 0.12); }
        function soundFirework(pitch) { playBubbleSound(0.4, pitch, 0.25); }
        function soundVictory() { playBubbleSound(0.6, 2500, 0.3); }
        function soundClear() { playBubbleSound(0.2, 450, 0.1); }        // 清空按钮

        // 给所有按钮绑定点击音效
        function addClickSoundToButtons() {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // 如果按钮有特定类，使用不同音效
                    if (this.classList.contains('btn-start')) soundStart();
                    else if (this.classList.contains('back-btn') || this.classList.contains('back-to-menu') || this.id === 'backFromSelect' || this.id === 'backFromGame' || this.id === 'backFromFinal') soundBack();
                    else if (this.id === 'clearSigBtn' || this.id === 'clearLeaderboard') soundClear();
                    else soundClick();
                });
            });
        }

        // ================================================================
        // 2. 数据 (已移除 nor)
        // ================================================================
        const PAIRS = [
            { id: 0, en: 'energetic', zh: '精力充沛的', phonetic: 'ˌenə\'dʒɛtɪk' },
            { id: 1, en: 'order', zh: '条理；顺序', phonetic: 'ˈɔːdə(r)' },
            { id: 2, en: 'explain', zh: '解释', phonetic: 'ɪk\'spleɪn' },
            { id: 3, en: 'careless', zh: '粗心的', phonetic: 'ˈkeərləs' },
            { id: 4, en: 'neither', zh: '也不', phonetic: 'ˈnaɪðə(r)' },
            { id: 6, en: 'accountant', zh: '会计', phonetic: 'əˈkaʊntənt' },
            { id: 7, en: 'suppose', zh: '认为；推断', phonetic: 'səˈpəʊz' },
            { id: 8, en: 'social', zh: '好交际的；社交的', phonetic: 'ˈsəʊʃəl' }
        ];

        const LEVELS = [
            { leftKey: 'en', rightKey: 'zh', desc: '左侧英文 ↔ 右侧中文' },
            { leftKey: 'en', rightKey: 'phonetic', desc: '左侧英文 ↔ 右侧音标' },
            { leftKey: 'zh', rightKey: 'phonetic', desc: '左侧中文 ↔ 右侧音标' }
        ];

        // 当前关卡名 (由选关传入)
        let currentLevelName = 'Unit 1 Welcome'; // 默认

        // ================================================================
        // 3. 游戏状态
        // ================================================================
        let currentLevel = 0;
        let leftItems = [];
        let rightItems = [];
        let matchedCount = 0;
        let isLevelComplete = false;
        let gameFinished = false;
        let dragData = null;
        let tempLine = null;
        let gameStartTime = null;
        let accumulatedTime = 0;
        let totalSeconds = 0;

        const leftCol = document.getElementById('leftCol');
        const rightCol = document.getElementById('rightCol');
        const svgOverlay = document.getElementById('svgOverlay');
        const message = document.getElementById('message');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        const levelBadge = document.getElementById('levelBadge');
        const levelDesc = document.getElementById('levelDesc');
        const canvas = document.getElementById('celebrationCanvas');
        const ctx = canvas.getContext('2d');

        const mainMenu = document.getElementById('mainMenu');
        const levelSelect = document.getElementById('levelSelect');
        const gameContainer = document.getElementById('gameContainer');

        // ================================================================
        // 4. 导航与选关
        // ================================================================
        function buildLevelSelect() {
            const grid = document.getElementById('unitGrid');
            grid.innerHTML = '';
            const units = ['Unit 1', 'Unit 2', 'Unit 3', 'Unit 4', 'Unit 5', 'Unit 6', 'Unit 7', 'Unit 8'];
            const modules = ['Welcome', 'Reading', 'Grammar', 'Integration'];

            units.forEach((unit, uIdx) => {
                const row = document.createElement('div');
                row.className = 'unit-row';
                const label = document.createElement('span');
                label.className = 'unit-label';
                label.textContent = unit;
                row.appendChild(label);

                modules.forEach((mod, mIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'module-btn';
                    btn.textContent = mod;
                    if (uIdx === 0 && mIdx === 0) {
                        btn.classList.add('active');
                        btn.addEventListener('click', function() {
                            currentLevelName = `${unit} ${mod}`;
                            enterGame();
                        });
                    } else {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    }
                    row.appendChild(btn);
                });
                grid.appendChild(row);
            });
        }

        function enterGame() {
            mainMenu.classList.remove('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.add('active');
            resetGame();
            accumulatedTime = 0;
            gameStartTime = Date.now();
            const overlay = document.getElementById('finalOverlay');
            if (overlay) overlay.remove();
            // 更新标题显示关卡名
            document.querySelector('.game-container h1 span:first-child').textContent = `🧩 ${currentLevelName}`;
        }

        function goToMainMenu() {
            mainMenu.classList.add('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.remove('active');
            const overlay = document.getElementById('finalOverlay');
            if (overlay) overlay.remove();
            resetGame();
            gameStartTime = null;
            accumulatedTime = 0;
            totalSeconds = 0;
            gameFinished = false;
            canvas.style.display = 'none';
        }

        function resetGame() {
            currentLevel = 0;
            gameFinished = false;
            resetLevel(0);
            nextBtn.disabled = true;
            canvas.style.display = 'none';
        }

        // ================================================================
        // 5. 关卡重置
        // ================================================================
        function resetLevel(levelIndex) {
            const level = LEVELS[levelIndex];
            const leftKey = level.leftKey;
            const rightKey = level.rightKey;

            const pairData = PAIRS.map(p => ({
                pairId: p.id,
                leftText: p[leftKey],
                rightText: p[rightKey]
            }));

            const leftShuffled = shuffle(pairData.map(p => ({ pairId: p.pairId, text: p.leftText })));
            const rightShuffled = shuffle(pairData.map(p => ({ pairId: p.pairId, text: p.rightText })));

            leftItems = leftShuffled.map(item => ({ ...item, matched: false }));
            rightItems = rightShuffled.map(item => ({ ...item, matched: false }));
            matchedCount = 0;
            isLevelComplete = false;
            gameFinished = false;

            renderItems();
            clearLines();
            nextBtn.disabled = true;
            message.textContent = '💡 从左侧拖拽到右侧配对';
            document.querySelectorAll('.item.wrong-flash').forEach(el => el.classList.remove('wrong-flash'));

            levelBadge.textContent = `第 ${levelIndex+1} / 3 关`;
            levelDesc.textContent = level.desc;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderItems() {
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            leftItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.pairid = item.pairId;
                div.dataset.side = 'left';
                div.textContent = item.text;
                if (item.matched) div.classList.add('matched');
                leftCol.appendChild(div);
            });

            rightItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.pairid = item.pairId;
                div.dataset.side = 'right';
                div.textContent = item.text;
                if (item.matched) div.classList.add('matched');
                rightCol.appendChild(div);
            });

            bindEvents();
        }

        function getEdgePoints(leftEl, rightEl) {
            const leftRect = leftEl.getBoundingClientRect();
            const rightRect = rightEl.getBoundingClientRect();
            const areaRect = document.getElementById('gameArea').getBoundingClientRect();
            const x1 = leftRect.right - areaRect.left;
            const y1 = leftRect.top + leftRect.height/2 - areaRect.top;
            const x2 = rightRect.left - areaRect.left;
            const y2 = rightRect.top + rightRect.height/2 - areaRect.top;
            return { x1, y1, x2, y2 };
        }

        function drawLine(x1, y1, x2, y2, color = '#2b7a2b', dashed = false, className = '') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '3');
            line.setAttribute('stroke-linecap', 'round');
            if (dashed) line.setAttribute('stroke-dasharray', '6');
            if (className) line.setAttribute('class', className);
            svgOverlay.appendChild(line);
            return line;
        }

        function clearLines() { svgOverlay.innerHTML = ''; }

        // ================================================================
        // 6. 拖拽
        // ================================================================
        function bindEvents() {
            const leftEls = leftCol.querySelectorAll('.item:not(.matched)');
            leftEls.forEach(el => {
                el.addEventListener('mousedown', onDragStart);
                el.addEventListener('touchstart', onDragStart, { passive: false });
            });

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchend', onDragEnd);
        }

        function onDragStart(e) {
            e.preventDefault();
            if (this.classList.contains('matched')) return;
            if (isLevelComplete) return;
            soundDrag();

            const touch = e.type === 'touchstart' ? e.touches[0] : e;
            const rect = this.getBoundingClientRect();
            dragData = {
                element: this,
                pairId: parseInt(this.dataset.pairid),
                startX: touch.clientX,
                startY: touch.clientY,
                offsetX: touch.clientX - rect.left,
                offsetY: touch.clientY - rect.top,
                isDragging: false
            };
            this.classList.add('dragging');
        }

        function onDragMove(e) {
            if (!dragData) return;
            e.preventDefault();

            const touch = e.type === 'touchmove' ? e.touches[0] : e;
            const clientX = touch.clientX;
            const clientY = touch.clientY;

            if (!dragData.isDragging) {
                const dx = clientX - dragData.startX;
                const dy = clientY - dragData.startY;
                if (Math.sqrt(dx*dx + dy*dy) < 5) return;
                dragData.isDragging = true;
                const leftEl = dragData.element;
                const rect = leftEl.getBoundingClientRect();
                const areaRect = document.getElementById('gameArea').getBoundingClientRect();
                const x1 = rect.right - areaRect.left;
                const y1 = rect.top + rect.height/2 - areaRect.top;
                tempLine = drawLine(x1, y1, x1, y1, '#3b82f6', true, 'temp');
            }

            if (tempLine) {
                const areaRect = document.getElementById('gameArea').getBoundingClientRect();
                const x = clientX - areaRect.left;
                const y = clientY - areaRect.top;
                tempLine.setAttribute('x2', x);
                tempLine.setAttribute('y2', y);
            }
        }

        function onDragEnd(e) {
            if (!dragData) return;
            if (tempLine) {
                tempLine.remove();
                tempLine = null;
            }
            const el = dragData.element;
            el.classList.remove('dragging');

            if (dragData.isDragging) {
                const touch = e.type === 'touchend' ? e.changedTouches[0] : e;
                const clientX = touch.clientX;
                const clientY = touch.clientY;
                const elementAt = document.elementFromPoint(clientX, clientY);
                if (elementAt && elementAt.classList && elementAt.classList.contains('item') && elementAt.dataset.side === 'right') {
                    const rightEl = elementAt;
                    if (!rightEl.classList.contains('matched')) {
                        const leftPairId = parseInt(el.dataset.pairid);
                        const rightPairId = parseInt(rightEl.dataset.pairid);
                        if (leftPairId === rightPairId) {
                            matchPair(leftPairId);
                        } else {
                            wrongPair(el, rightEl);
                        }
                    }
                }
            }
            dragData = null;
        }

        function matchPair(pairId) {
            const leftIdx = leftItems.findIndex(item => item.pairId === pairId);
            const rightIdx = rightItems.findIndex(item => item.pairId === pairId);
            if (leftIdx === -1 || rightIdx === -1) return;
            if (leftItems[leftIdx].matched || rightItems[rightIdx].matched) return;

            leftItems[leftIdx].matched = true;
            rightItems[rightIdx].matched = true;
            matchedCount++;
            soundMatch();

            const leftEl = leftCol.querySelector(`.item[data-pairid="${pairId}"][data-side="left"]`);
            const rightEl = rightCol.querySelector(`.item[data-pairid="${pairId}"][data-side="right"]`);
            if (leftEl) leftEl.classList.add('matched');
            if (rightEl) rightEl.classList.add('matched');

            if (leftEl && rightEl) {
                const { x1, y1, x2, y2 } = getEdgePoints(leftEl, rightEl);
                drawLine(x1, y1, x2, y2);
            }

            if (matchedCount === leftItems.length) {
                isLevelComplete = true;
                nextBtn.disabled = true;
                message.textContent = '🎉 所有配对完成！点击 “检查” 验证通过！';
            } else {
                message.textContent = `✅ 已配对 ${matchedCount} / ${leftItems.length}`;
            }
            bindEvents();
        }

        function wrongPair(leftEl, rightEl) {
            soundWrong();
            leftEl.classList.add('wrong-flash');
            rightEl.classList.add('wrong-flash');
            message.textContent = '❌ 配对错误，请重试';
            setTimeout(() => {
                leftEl.classList.remove('wrong-flash');
                rightEl.classList.remove('wrong-flash');
            }, 500);
        }

        // ================================================================
        // 7. 检查 & 下一关
        // ================================================================
        checkBtn.addEventListener('click', function() {
            if (gameFinished) return;
            soundCheck();

            if (!isLevelComplete) {
                const left = leftItems.filter(item => !item.matched).length;
                message.textContent = `⚠️ 还有 ${left} 项未配对，继续努力！`;
                return;
            }

            // 暂停计时
            if (gameStartTime) {
                accumulatedTime += Date.now() - gameStartTime;
                gameStartTime = null;
            }

            if (currentLevel === 0 || currentLevel === 1) {
                showFireworks(function() {
                    nextBtn.disabled = false;
                    message.textContent = '🎆 烟花庆祝！点击 "下一关" 继续';
                });
            } else if (currentLevel === 2) {
                showFinalMessage();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (gameFinished) return;
            if (!isLevelComplete) return;
            soundNext();

            if (currentLevel < 2) {
                currentLevel++;
                gameStartTime = Date.now();
                resetLevel(currentLevel);
                nextBtn.disabled = true;
            }
        });

        // ================================================================
        // 8. 庆祝效果
        // ================================================================
        function showFireworks(callback) {
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43'];

            function createWave(cx, cy, count, speed, colorOffset) {
                const particles = [];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * speed + 2;
                    particles.push({
                        x: cx,
                        y: cy,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 2,
                        life: 1,
                        color: colors[(i + colorOffset) % colors.length],
                        size: Math.random() * 4 + 2
                    });
                }
                return particles;
            }

            let allParticles = [];
            const waves = [
                { cx: window.innerWidth * 0.4, cy: window.innerHeight * 0.4, count: 150, speed: 8, pitch: 800 },
                { cx: window.innerWidth * 0.6, cy: window.innerHeight * 0.3, count: 180, speed: 9, pitch: 1100 },
                { cx: window.innerWidth * 0.5, cy: window.innerHeight * 0.6, count: 200, speed: 10, pitch: 1400 }
            ];

            let waveIndex = 0;
            function launchNextWave() {
                if (waveIndex >= waves.length) {
                    animateFireworks();
                    return;
                }
                const w = waves[waveIndex];
                soundFirework(w.pitch);
                const newParticles = createWave(w.cx, w.cy, w.count, w.speed, waveIndex * 10);
                allParticles = allParticles.concat(newParticles);
                waveIndex++;
                setTimeout(launchNextWave, 350);
            }

            function animateFireworks() {
                let alive = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                allParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life -= 0.006;
                    if (p.life > 0) {
                        alive = true;
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                if (alive) {
                    requestAnimationFrame(animateFireworks);
                } else {
                    canvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (callback) callback();
                }
            }
            launchNextWave();
        }

        // ================================================================
        // 9. 最终结算 (包含云端排行榜)
        // ================================================================
        function showFinalMessage() {
            totalSeconds = Math.floor(accumulatedTime / 1000);
            if (totalSeconds === 0 && gameStartTime) {
                totalSeconds = Math.floor((Date.now() - gameStartTime + accumulatedTime) / 1000);
            }

            let title = '';
            if (totalSeconds < 80) title = '华兴的传奇';
            else if (totalSeconds < 180) title = '挺有实力嘛！';
            else title = '再接再厉！熟能生巧！';

            gameFinished = true;
            soundVictory();

            const overlay = document.createElement('div');
            overlay.className = 'final-overlay';
            overlay.id = 'finalOverlay';

            overlay.innerHTML = `
                <div class="final-panel">
                    <h2>🏆 通关完成！</h2>
                    <div style="text-align:center;">
                        <span class="title-badge">${title}</span>
                    </div>
                    <div class="stats">
                        ⏱️ 总用时：<strong>${totalSeconds}</strong> 秒 &nbsp;|&nbsp; 关卡：<strong>${currentLevelName}</strong>
                    </div>
                    <div class="signature-area">
                        <label>✍️ 手写签名（在下方画布上签名）</label>
                        <canvas id="signatureCanvas" width="300" height="150"></canvas>
                        <div class="signature-buttons">
                            <button class="btn btn-secondary" id="clearSigBtn">清除</button>
                            <button class="btn btn-success" id="saveSigBtn">✅ 确认签名</button>
                        </div>
                    </div>
                    <div class="leaderboard">
                        <h3>
                            <span>📋 排行榜 <span style="font-size:14px;font-weight:normal;color:#5c6f8c;">（${currentLevelName}）</span></span>
                            <button class="clear-btn" id="clearLeaderboard">清空记录</button>
                        </h3>
                        <div class="leaderboard-list" id="leaderboardList"></div>
                    </div>
                    <div class="final-actions">
                        <button class="btn btn-secondary" id="backFromFinal">🏠 返回主界面</button>
                        <button class="btn btn-primary" id="restartFromFinal">🔄 再来一局</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            // ---------- 签名 ----------
            const sigCanvas = document.getElementById('signatureCanvas');
            const sigCtx = sigCanvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                const rect = sigCanvas.getBoundingClientRect();
                const scaleX = sigCanvas.width / rect.width;
                const scaleY = sigCanvas.height / rect.height;
                const touch = e.type === 'touchstart' ? e.touches[0] : e;
                lastX = (touch.clientX - rect.left) * scaleX;
                lastY = (touch.clientY - rect.top) * scaleY;
            }
            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const rect = sigCanvas.getBoundingClientRect();
                const scaleX = sigCanvas.width / rect.width;
                const scaleY = sigCanvas.height / rect.height;
                const touch = e.type === 'touchmove' ? e.touches[0] : e;
                const x = (touch.clientX - rect.left) * scaleX;
                const y = (touch.clientY - rect.top) * scaleY;
                sigCtx.beginPath();
                sigCtx.moveTo(lastX, lastY);
                sigCtx.lineTo(x, y);
                sigCtx.strokeStyle = '#1a2b4a';
                sigCtx.lineWidth = 3;
                sigCtx.lineCap = 'round';
                sigCtx.stroke();
                lastX = x;
                lastY = y;
            }
            function endDraw(e) { isDrawing = false; }

            sigCanvas.addEventListener('mousedown', startDraw);
            sigCanvas.addEventListener('mousemove', draw);
            sigCanvas.addEventListener('mouseup', endDraw);
            sigCanvas.addEventListener('mouseleave', endDraw);
            sigCanvas.addEventListener('touchstart', startDraw, { passive: false });
            sigCanvas.addEventListener('touchmove', draw, { passive: false });
            sigCanvas.addEventListener('touchend', endDraw, { passive: false });

            document.getElementById('clearSigBtn').addEventListener('click', function() {
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
                soundClear();
            });

            // ---------- 保存签名 + 云端上传 ----------
            document.getElementById('saveSigBtn').addEventListener('click', function() {
                const imageData = sigCtx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
                let isBlank = true;
                for (let i = 3; i < imageData.data.length; i += 4) {
                    if (imageData.data[i] > 0) { isBlank = false; break; }
                }
                if (isBlank) {
                    alert('请先签名再确认！');
                    return;
                }
                const dataURL = sigCanvas.toDataURL('image/png');
                const record = {
                    level: currentLevelName,
                    time: totalSeconds,
                    title: title,
                    signature: dataURL,
                    date: new Date().toLocaleString()
                };

                // 先保存到本地（备用）
                let localRecords = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                localRecords.push(record);
                localStorage.setItem('leaderboard', JSON.stringify(localRecords));

                // 上传到 Firebase
                if (firebaseInitialized && database) {
                    const ref = database.ref('leaderboard');
                    ref.push(record).then(() => {
                        alert('✅ 签名已保存并同步到云端！');
                        renderLeaderboard();
                    }).catch(err => {
                        alert('⚠️ 云端同步失败，但已保存到本地。');
                        console.error(err);
                        renderLeaderboard();
                    });
                } else {
                    // 仅本地存储
                    alert('✅ 签名已保存到本地（云端未连接）。');
                    renderLeaderboard();
                }
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            });

            // ---------- 排行榜渲染（按关卡过滤） ----------
            function renderLeaderboard() {
                const list = document.getElementById('leaderboardList');
                // 从 Firebase 读取，失败则用本地
                function displayRecords(records) {
                    const filtered = records.filter(r => r.level === currentLevelName);
                    if (filtered.length === 0) {
                        list.innerHTML = `<div class="leaderboard-empty">暂无“${currentLevelName}”的记录，快来挑战吧！</div>`;
                        return;
                    }
                    filtered.sort((a, b) => a.time - b.time);
                    list.innerHTML = filtered.map((rec, idx) => `
                        <div class="leaderboard-item">
                            <img src="${rec.signature}" alt="签名" class="signature-img">
                            <div class="info">
                                <div class="title">${rec.title}</div>
                                <div style="font-size:12px; color:#5c6f8c;">⏱️ ${rec.time}秒 · ${rec.date}</div>
                                <span class="level-name">${rec.level}</span>
                            </div>
                        </div>
                    `).join('');
                }

                if (firebaseInitialized && database) {
                    const ref = database.ref('leaderboard');
                    ref.once('value').then(snapshot => {
                        const data = snapshot.val();
                        let records = [];
                        if (data) {
                            records = Object.values(data);
                        }
                        // 合并本地（避免遗漏）
                        const local = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                        // 合并去重（简单处理：用时间+签名去重，这里简化，直接用本地覆盖）
                        // 实际上以云端为主，本地作为备份
                        if (records.length === 0 && local.length > 0) {
                            records = local;
                            // 尝试上传本地数据
                            const refPush = database.ref('leaderboard');
                            local.forEach(r => refPush.push(r));
                        }
                        displayRecords(records);
                    }).catch(err => {
                        console.warn('读取云端失败，使用本地数据', err);
                        const local = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                        displayRecords(local);
                    });
                } else {
                    const local = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                    displayRecords(local);
                }
            }

            // ---------- 清空排行榜 ----------
            document.getElementById('clearLeaderboard').addEventListener('click', function() {
                if (confirm(`确定要清空“${currentLevelName}”的所有记录吗？此操作不可恢复！`)) {
                    if (firebaseInitialized && database) {
                        const ref = database.ref('leaderboard');
                        ref.orderByChild('level').equalTo(currentLevelName).once('value').then(snapshot => {
                            const updates = {};
                            snapshot.forEach(child => {
                                updates[child.key] = null;
                            });
                            ref.update(updates).then(() => {
                                alert('已清空云端记录！');
                                renderLeaderboard();
                            });
                        });
                    } else {
                        // 清空本地
                        let local = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                        local = local.filter(r => r.level !== currentLevelName);
                        localStorage.setItem('leaderboard', JSON.stringify(local));
                        alert('已清空本地记录！');
                        renderLeaderboard();
                    }
                }
            });

            // ---------- 返回主界面 ----------
            document.getElementById('backFromFinal').addEventListener('click', function() {
                overlay.remove();
                canvas.style.display = 'none';
                goToMainMenu();
            });

            // ---------- 再来一局 ----------
            document.getElementById('restartFromFinal').addEventListener('click', function() {
                overlay.remove();
                canvas.style.display = 'none';
                accumulatedTime = 0;
                gameStartTime = Date.now();
                totalSeconds = 0;
                currentLevel = 0;
                resetLevel(0);
                nextBtn.disabled = true;
                gameFinished = false;
                message.textContent = '🔄 新开局，加油！';
                soundNext();
            });

            // 首次渲染
            renderLeaderboard();
            // 给新生成的按钮添加音效
            addClickSoundToButtons();
        }

        // ================================================================
        // 10. 界面切换绑定
        // ================================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            mainMenu.classList.remove('active');
            levelSelect.classList.add('active');
        });

        document.getElementById('backFromSelect').addEventListener('click', goToMainMenu);

        document.getElementById('backFromGame').addEventListener('click', function() {
            if (confirm('确定要退出当前游戏吗？进度将丢失。')) {
                goToMainMenu();
            }
        });

        // ================================================================
        // 11. 初始化
        // ================================================================
        function init() {
            buildLevelSelect();
            mainMenu.classList.add('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.remove('active');
            canvas.style.display = 'none';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
            resetLevel(0);
            // 给所有按钮绑定音效
            addClickSoundToButtons();
        }

        init();
    })();
</script>

</body>
</html>
