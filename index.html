<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词连线 · 三关挑战</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15);
            padding: 30px 35px 40px;
            max-width: 900px;
            width: 100%;
            display: none;
        }
        .container.active {
            display: block;
        }
        #mainMenu {
            text-align: center;
            padding: 50px 20px;
        }
        #mainMenu h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #1a2b4a;
        }
        #mainMenu p {
            font-size: 20px;
            color: #5c6f8c;
            margin-bottom: 30px;
        }
        .btn-start {
            font-size: 24px;
            padding: 14px 50px;
            background: #1a2b4a;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 20px rgba(26,43,74,0.3);
        }
        .btn-start:hover {
            transform: scale(1.05);
            background: #0f1e38;
        }
        #levelSelect {
            padding: 10px 0;
        }
        #levelSelect h2 {
            text-align: center;
            color: #1a2b4a;
            font-size: 28px;
            margin: 0 0 20px 0;
        }
        .unit-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .unit-label {
            font-weight: 600;
            color: #2c3e5c;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .module-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            background: #eef2f7;
            color: #1a2b4a;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            flex: 0 1 auto;
        }
        .module-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .module-btn.active:hover {
            transform: translateY(-2px);
        }
        .module-btn.disabled {
            background: #e8ecf2;
            color: #9aa8b9;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .back-btn {
            margin-top: 20px;
            padding: 8px 24px;
            background: #dce3ed;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .back-btn:hover {
            background: #c8d2e0;
        }

        /* 游戏界面 */
        .game-container h1 {
            font-weight: 600;
            font-size: 26px;
            color: #1a2b4a;
            margin: 0 0 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .game-container .level-badge {
            background: #3b82f6;
            color: white;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
        }
        .game-container .subhead {
            color: #5c6f8c;
            font-size: 14px;
            margin: 0 0 20px 0;
            border-left: 4px solid #3b82f6;
            padding-left: 14px;
            background: #f8faff;
            border-radius: 0 12px 12px 0;
            line-height: 1.5;
        }
        .game-area {
            position: relative;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 20px 0;
            min-height: 400px;
        }
        .game-area .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 40%;
            z-index: 2;
        }
        .game-area .column.right {
            align-items: flex-end;
        }
        .game-area .item {
            padding: 12px 18px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 0 1px #d5e0ee;
            font-size: 18px;
            font-weight: 500;
            color: #0b1e33;
            cursor: grab;
            transition: transform 0.1s, box-shadow 0.15s, opacity 0.2s;
            text-align: center;
            min-width: 80px;
            position: relative;
            touch-action: none;
        }
        .game-area .item:active {
            cursor: grabbing;
        }
        .game-area .item.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }
        .game-area .item.matched {
            background: #e0f0e0;
            box-shadow: 0 0 0 2px #2b7a2b;
            color: #0d4f0d;
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }
        .game-area .item.wrong-flash {
            animation: flashRed 0.5s;
        }
        @keyframes flashRed {
            0%, 100% { background: white; }
            50% { background: #fbc5c5; box-shadow: 0 0 0 2px #b33a3a; }
        }
        .game-area .item:hover:not(.matched) {
            background: #eaf1fe;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15), 0 0 0 1px #3b82f6;
        }
        .svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .svg-overlay line {
            stroke-width: 3;
            stroke: #2b7a2b;
            stroke-linecap: round;
        }
        .svg-overlay line.temp {
            stroke: #3b82f6;
            stroke-dasharray: 6;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e9eef6;
        }
        .controls .btn {
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .controls .btn-primary {
            background: #1a2b4a;
            color: white;
        }
        .controls .btn-primary:hover {
            background: #0f1e38;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26,43,74,0.2);
        }
        .controls .btn-success {
            background: #1f8b4c;
            color: white;
        }
        .controls .btn-success:hover {
            background: #16703d;
            transform: translateY(-2px);
        }
        .controls .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .message {
            text-align: center;
            font-size: 18px;
            color: #1a2b4a;
            margin-top: 12px;
            min-height: 40px;
            font-weight: 500;
        }
        .game-container .back-to-menu {
            display: inline-block;
            margin-bottom: 12px;
            padding: 6px 18px;
            background: #dce3ed;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.15s;
        }
        .game-container .back-to-menu:hover {
            background: #c8d2e0;
        }
        #celebrationCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        .final-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            overflow-y: auto;
        }
        .final-panel {
            background: white;
            border-radius: 32px;
            padding: 30px 35px 35px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        .final-panel h2 {
            text-align: center;
            font-size: 28px;
            margin: 0 0 10px 0;
            color: #1a2b4a;
        }
        .final-panel .title-badge {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 40px;
            background: #fbbf24;
            color: #1a2b4a;
            display: inline-block;
            margin: 0 auto 15px;
            width: auto;
        }
        .final-panel .stats {
            text-align: center;
            font-size: 18px;
            color: #2c3e5c;
            margin-bottom: 20px;
        }
        .signature-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 10px 0 20px;
        }
        .signature-area label {
            font-weight: 600;
            font-size: 16px;
            color: #1a2b4a;
        }
        #signatureCanvas {
            border: 2px solid #b3c7e0;
            border-radius: 16px;
            background: white;
            touch-action: none;
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 300 / 150;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30"><circle cx="12" cy="12" r="6" fill="black" opacity="0.4"/><line x1="12" y1="12" x2="12" y2="28" stroke="black" stroke-width="2" opacity="0.4"/></svg>') 12 12, auto;
        }
        .signature-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .signature-buttons .btn {
            padding: 8px 24px;
            font-size: 14px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .leaderboard {
            margin-top: 20px;
            border-top: 2px solid #e9eef6;
            padding-top: 16px;
        }
        .leaderboard h3 {
            font-size: 18px;
            margin: 0 0 12px 0;
            color: #1a2b4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .leaderboard .clear-btn {
            font-size: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 14px;
            cursor: pointer;
        }
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f8faff;
            border-radius: 12px;
            padding: 8px 14px;
            border: 1px solid #e6edf6;
        }
        .leaderboard-item .signature-img {
            width: 50px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            object-fit: contain;
        }
        .leaderboard-item .info {
            flex: 1;
            font-size: 14px;
            color: #1a2b4a;
        }
        .leaderboard-item .info .title {
            font-weight: 600;
            color: #d97706;
        }
        .leaderboard-empty {
            color: #7f8fa6;
            font-style: italic;
            text-align: center;
            padding: 10px;
        }
        .final-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .final-actions .btn {
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .final-actions .btn-primary {
            background: #1a2b4a;
            color: white;
        }
        .final-actions .btn-primary:hover {
            background: #0f1e38;
        }
        .final-actions .btn-secondary {
            background: #dce3ed;
            color: #1a2b4a;
        }
        .final-actions .btn-secondary:hover {
            background: #c8d2e0;
        }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .game-area .column { width: 45%; }
            .game-area .item { font-size: 14px; padding: 8px 10px; }
            .final-panel { padding: 20px; }
            .unit-row { gap: 8px; }
            .module-btn { padding: 6px 14px; font-size: 12px; }
            .unit-label { width: 40px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- 主界面 -->
<div class="container active" id="mainMenu">
    <h1>🧩 欢迎来到连线挑战！</h1>
    <p>三关单词配对 · 测试你的词汇与速度</p>
    <button class="btn-start" id="startBtn">🚀 开始</button>
</div>

<!-- 选关界面 -->
<div class="container" id="levelSelect">
    <h2>📚 选择单元</h2>
    <div id="unitGrid"></div>
    <div style="text-align:center; margin-top:20px;">
        <button class="back-btn" id="backFromSelect">← 返回主界面</button>
    </div>
</div>

<!-- 游戏界面 -->
<div class="container game-container" id="gameContainer">
    <button class="back-to-menu" id="backFromGame">← 返回主界面</button>
    <h1>
        <span>🧩 单词连线</span>
        <span class="level-badge" id="levelBadge">第 1 / 3 关</span>
    </h1>
    <div class="subhead" id="levelDesc">左侧英文 ↔ 右侧中文</div>

    <div class="game-area" id="gameArea">
        <div class="column" id="leftCol"></div>
        <div class="column right" id="rightCol"></div>
        <svg class="svg-overlay" id="svgOverlay"></svg>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="checkBtn">✅ 检查</button>
        <button class="btn btn-success" id="nextBtn" disabled>▶ 下一关</button>
    </div>
    <div class="message" id="message">💡 从左侧拖拽到右侧配对</div>
</div>

<canvas id="celebrationCanvas"></canvas>

<script>
    (function() {
        // ================================================================
        // 1. 音频工具
        // ================================================================
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }
        function playBubbleSound(volume = 0.3, pitch = 800, duration = 0.12) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(pitch * 0.5, ctx.currentTime + duration);
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) { /* 静默失败 */ }
        }
        function soundDrag() { playBubbleSound(0.2, 600, 0.08); }
        function soundMatch() { playBubbleSound(0.35, 900, 0.15); }
        function soundWrong() { playBubbleSound(0.3, 300, 0.2); }
        function soundCheck() { playBubbleSound(0.3, 1200, 0.1); }
        function soundNext() { playBubbleSound(0.4, 1500, 0.12); }
        function soundFirework(pitch) { playBubbleSound(0.4, pitch, 0.25); }
        function soundVictory() { playBubbleSound(0.6, 2500, 0.3); }

        // ================================================================
        // 2. 数据 (已移除 nor)
        // ================================================================
        const PAIRS = [
            { id: 0, en: 'energetic', zh: '精力充沛的', phonetic: 'ˌenə\'dʒɛtɪk' },
            { id: 1, en: 'order', zh: '条理；顺序', phonetic: 'ˈɔːdə(r)' },
            { id: 2, en: 'explain', zh: '解释', phonetic: 'ɪk\'spleɪn' },
            { id: 3, en: 'careless', zh: '粗心的', phonetic: 'ˈkeərləs' },
            { id: 4, en: 'neither', zh: '也不', phonetic: 'ˈnaɪðə(r)' },
            // 已移除 nor (id:5)
            { id: 6, en: 'accountant', zh: '会计', phonetic: 'əˈkaʊntənt' },
            { id: 7, en: 'suppose', zh: '认为；推断', phonetic: 'səˈpəʊz' },
            { id: 8, en: 'social', zh: '好交际的；社交的', phonetic: 'ˈsəʊʃəl' }
        ];

        const LEVELS = [
            { leftKey: 'en', rightKey: 'zh', desc: '左侧英文 ↔ 右侧中文' },
            { leftKey: 'en', rightKey: 'phonetic', desc: '左侧英文 ↔ 右侧音标' },
            { leftKey: 'zh', rightKey: 'phonetic', desc: '左侧中文 ↔ 右侧音标' }
        ];

        // ================================================================
        // 3. 游戏状态
        // ================================================================
        let currentLevel = 0;
        let leftItems = [];
        let rightItems = [];
        let matchedCount = 0;
        let isLevelComplete = false;
        let gameFinished = false;
        let dragData = null;
        let tempLine = null;
        let gameStartTime = null;         // 开始计时时间戳
        let accumulatedTime = 0;          // 已累计的游戏时间（毫秒），不含庆祝
        let totalSeconds = 0;             // 最终秒数

        const leftCol = document.getElementById('leftCol');
        const rightCol = document.getElementById('rightCol');
        const svgOverlay = document.getElementById('svgOverlay');
        const message = document.getElementById('message');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        const levelBadge = document.getElementById('levelBadge');
        const levelDesc = document.getElementById('levelDesc');
        const canvas = document.getElementById('celebrationCanvas');
        const ctx = canvas.getContext('2d');

        const mainMenu = document.getElementById('mainMenu');
        const levelSelect = document.getElementById('levelSelect');
        const gameContainer = document.getElementById('gameContainer');

        // ================================================================
        // 4. 导航与选关
        // ================================================================
        function buildLevelSelect() {
            const grid = document.getElementById('unitGrid');
            grid.innerHTML = '';
            const units = ['Unit 1', 'Unit 2', 'Unit 3', 'Unit 4', 'Unit 5', 'Unit 6', 'Unit 7', 'Unit 8'];
            const modules = ['Welcome', 'Reading', 'Grammar', 'Integration'];

            units.forEach((unit, uIdx) => {
                const row = document.createElement('div');
                row.className = 'unit-row';
                const label = document.createElement('span');
                label.className = 'unit-label';
                label.textContent = unit;
                row.appendChild(label);

                modules.forEach((mod, mIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'module-btn';
                    btn.textContent = mod;
                    if (uIdx === 0 && mIdx === 0) {
                        btn.classList.add('active');
                        btn.addEventListener('click', function() { enterGame(); });
                    } else {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    }
                    row.appendChild(btn);
                });
                grid.appendChild(row);
            });
        }

        function enterGame() {
            mainMenu.classList.remove('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.add('active');
            resetGame();
            // 开始计时
            accumulatedTime = 0;
            gameStartTime = Date.now();
            const overlay = document.getElementById('finalOverlay');
            if (overlay) overlay.remove();
        }

        function goToMainMenu() {
            mainMenu.classList.add('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.remove('active');
            const overlay = document.getElementById('finalOverlay');
            if (overlay) overlay.remove();
            resetGame();
            gameStartTime = null;
            accumulatedTime = 0;
            totalSeconds = 0;
            gameFinished = false;
            canvas.style.display = 'none';
        }

        function resetGame() {
            currentLevel = 0;
            gameFinished = false;
            resetLevel(0);
            nextBtn.disabled = true;
            canvas.style.display = 'none';
        }

        // ================================================================
        // 5. 关卡重置
        // ================================================================
        function resetLevel(levelIndex) {
            const level = LEVELS[levelIndex];
            const leftKey = level.leftKey;
            const rightKey = level.rightKey;

            const pairData = PAIRS.map(p => ({
                pairId: p.id,
                leftText: p[leftKey],
                rightText: p[rightKey]
            }));

            const leftShuffled = shuffle(pairData.map(p => ({ pairId: p.pairId, text: p.leftText })));
            const rightShuffled = shuffle(pairData.map(p => ({ pairId: p.pairId, text: p.rightText })));

            leftItems = leftShuffled.map(item => ({ ...item, matched: false }));
            rightItems = rightShuffled.map(item => ({ ...item, matched: false }));
            matchedCount = 0;
            isLevelComplete = false;
            gameFinished = false;

            renderItems();
            clearLines();
            nextBtn.disabled = true;
            message.textContent = '💡 从左侧拖拽到右侧配对';
            document.querySelectorAll('.item.wrong-flash').forEach(el => el.classList.remove('wrong-flash'));

            levelBadge.textContent = `第 ${levelIndex+1} / 3 关`;
            levelDesc.textContent = level.desc;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderItems() {
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            leftItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.pairid = item.pairId;
                div.dataset.side = 'left';
                div.textContent = item.text;
                if (item.matched) div.classList.add('matched');
                leftCol.appendChild(div);
            });

            rightItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.dataset.pairid = item.pairId;
                div.dataset.side = 'right';
                div.textContent = item.text;
                if (item.matched) div.classList.add('matched');
                rightCol.appendChild(div);
            });

            bindEvents();
        }

        function getEdgePoints(leftEl, rightEl) {
            const leftRect = leftEl.getBoundingClientRect();
            const rightRect = rightEl.getBoundingClientRect();
            const areaRect = document.getElementById('gameArea').getBoundingClientRect();
            const x1 = leftRect.right - areaRect.left;
            const y1 = leftRect.top + leftRect.height/2 - areaRect.top;
            const x2 = rightRect.left - areaRect.left;
            const y2 = rightRect.top + rightRect.height/2 - areaRect.top;
            return { x1, y1, x2, y2 };
        }

        function drawLine(x1, y1, x2, y2, color = '#2b7a2b', dashed = false, className = '') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', '3');
            line.setAttribute('stroke-linecap', 'round');
            if (dashed) line.setAttribute('stroke-dasharray', '6');
            if (className) line.setAttribute('class', className);
            svgOverlay.appendChild(line);
            return line;
        }

        function clearLines() { svgOverlay.innerHTML = ''; }

        // ================================================================
        // 6. 拖拽 (原有)
        // ================================================================
        function bindEvents() {
            const leftEls = leftCol.querySelectorAll('.item:not(.matched)');
            leftEls.forEach(el => {
                el.addEventListener('mousedown', onDragStart);
                el.addEventListener('touchstart', onDragStart, { passive: false });
            });

            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('touchmove', onDragMove, { passive: false });
            document.addEventListener('mouseup', onDragEnd);
            document.addEventListener('touchend', onDragEnd);
        }

        function onDragStart(e) {
            e.preventDefault();
            if (this.classList.contains('matched')) return;
            if (isLevelComplete) return;
            soundDrag();

            const touch = e.type === 'touchstart' ? e.touches[0] : e;
            const rect = this.getBoundingClientRect();
            dragData = {
                element: this,
                pairId: parseInt(this.dataset.pairid),
                startX: touch.clientX,
                startY: touch.clientY,
                offsetX: touch.clientX - rect.left,
                offsetY: touch.clientY - rect.top,
                isDragging: false
            };
            this.classList.add('dragging');
        }

        function onDragMove(e) {
            if (!dragData) return;
            e.preventDefault();

            const touch = e.type === 'touchmove' ? e.touches[0] : e;
            const clientX = touch.clientX;
            const clientY = touch.clientY;

            if (!dragData.isDragging) {
                const dx = clientX - dragData.startX;
                const dy = clientY - dragData.startY;
                if (Math.sqrt(dx*dx + dy*dy) < 5) return;
                dragData.isDragging = true;
                const leftEl = dragData.element;
                const rect = leftEl.getBoundingClientRect();
                const areaRect = document.getElementById('gameArea').getBoundingClientRect();
                const x1 = rect.right - areaRect.left;
                const y1 = rect.top + rect.height/2 - areaRect.top;
                tempLine = drawLine(x1, y1, x1, y1, '#3b82f6', true, 'temp');
            }

            if (tempLine) {
                const areaRect = document.getElementById('gameArea').getBoundingClientRect();
                const x = clientX - areaRect.left;
                const y = clientY - areaRect.top;
                tempLine.setAttribute('x2', x);
                tempLine.setAttribute('y2', y);
            }
        }

        function onDragEnd(e) {
            if (!dragData) return;
            if (tempLine) {
                tempLine.remove();
                tempLine = null;
            }
            const el = dragData.element;
            el.classList.remove('dragging');

            if (dragData.isDragging) {
                const touch = e.type === 'touchend' ? e.changedTouches[0] : e;
                const clientX = touch.clientX;
                const clientY = touch.clientY;
                const elementAt = document.elementFromPoint(clientX, clientY);
                if (elementAt && elementAt.classList && elementAt.classList.contains('item') && elementAt.dataset.side === 'right') {
                    const rightEl = elementAt;
                    if (!rightEl.classList.contains('matched')) {
                        const leftPairId = parseInt(el.dataset.pairid);
                        const rightPairId = parseInt(rightEl.dataset.pairid);
                        if (leftPairId === rightPairId) {
                            matchPair(leftPairId);
                        } else {
                            wrongPair(el, rightEl);
                        }
                    }
                }
            }
            dragData = null;
        }

        function matchPair(pairId) {
            const leftIdx = leftItems.findIndex(item => item.pairId === pairId);
            const rightIdx = rightItems.findIndex(item => item.pairId === pairId);
            if (leftIdx === -1 || rightIdx === -1) return;
            if (leftItems[leftIdx].matched || rightItems[rightIdx].matched) return;

            leftItems[leftIdx].matched = true;
            rightItems[rightIdx].matched = true;
            matchedCount++;
            soundMatch();

            const leftEl = leftCol.querySelector(`.item[data-pairid="${pairId}"][data-side="left"]`);
            const rightEl = rightCol.querySelector(`.item[data-pairid="${pairId}"][data-side="right"]`);
            if (leftEl) leftEl.classList.add('matched');
            if (rightEl) rightEl.classList.add('matched');

            if (leftEl && rightEl) {
                const { x1, y1, x2, y2 } = getEdgePoints(leftEl, rightEl);
                drawLine(x1, y1, x2, y2);
            }

            if (matchedCount === leftItems.length) {
                isLevelComplete = true;
                nextBtn.disabled = true;
                message.textContent = '🎉 所有配对完成！点击 “检查” 验证通过！';
            } else {
                message.textContent = `✅ 已配对 ${matchedCount} / ${leftItems.length}`;
            }
            bindEvents();
        }

        function wrongPair(leftEl, rightEl) {
            soundWrong();
            leftEl.classList.add('wrong-flash');
            rightEl.classList.add('wrong-flash');
            message.textContent = '❌ 配对错误，请重试';
            setTimeout(() => {
                leftEl.classList.remove('wrong-flash');
                rightEl.classList.remove('wrong-flash');
            }, 500);
        }

        // ================================================================
        // 7. 检查 & 下一关 (修改计时逻辑)
        // ================================================================
        checkBtn.addEventListener('click', function() {
            if (gameFinished) return;
            soundCheck();

            if (!isLevelComplete) {
                const left = leftItems.filter(item => !item.matched).length;
                message.textContent = `⚠️ 还有 ${left} 项未配对，继续努力！`;
                return;
            }

            // 当前关已全部配对，触发庆祝
            // 暂停计时：记录已用时间
            if (gameStartTime) {
                const elapsed = Date.now() - gameStartTime;
                accumulatedTime += elapsed;
                gameStartTime = null; // 暂停
            }

            if (currentLevel === 0) {
                // 第一关烟花
                showFireworks(function() {
                    // 烟花结束后启用下一关
                    nextBtn.disabled = false;
                    message.textContent = '🎆 烟花庆祝！点击 "下一关" 继续';
                });
            } else if (currentLevel === 1) {
                // 第二关烟花（取代小狗）
                showFireworks(function() {
                    nextBtn.disabled = false;
                    message.textContent = '🎆 烟花庆祝！点击 "下一关" 继续';
                });
            } else if (currentLevel === 2) {
                // 第三关通关，直接结算（不再放烟花，用 final 效果）
                showFinalMessage();
            }
        });

        nextBtn.addEventListener('click', function() {
            if (gameFinished) return;
            if (!isLevelComplete) return;
            soundNext();

            if (currentLevel < 2) {
                currentLevel++;
                // 恢复计时：重置 startTime
                gameStartTime = Date.now();
                resetLevel(currentLevel);
                nextBtn.disabled = true;
            } else {
                // 第三关已在 final 中处理，不会到这里
            }
        });

        // ================================================================
        // 8. 庆祝效果
        // ================================================================
        // 烟花函数：带回调
        function showFireworks(callback) {
            canvas.style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff', '#ff9f43'];

            function createWave(cx, cy, count, speed, colorOffset) {
                const particles = [];
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * speed + 2;
                    particles.push({
                        x: cx,
                        y: cy,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd - 2,
                        life: 1,
                        color: colors[(i + colorOffset) % colors.length],
                        size: Math.random() * 4 + 2
                    });
                }
                return particles;
            }

            let allParticles = [];
            const waves = [
                { cx: window.innerWidth * 0.4, cy: window.innerHeight * 0.4, count: 150, speed: 8, pitch: 800 },
                { cx: window.innerWidth * 0.6, cy: window.innerHeight * 0.3, count: 180, speed: 9, pitch: 1100 },
                { cx: window.innerWidth * 0.5, cy: window.innerHeight * 0.6, count: 200, speed: 10, pitch: 1400 }
            ];

            let waveIndex = 0;
            function launchNextWave() {
                if (waveIndex >= waves.length) {
                    animateFireworks();
                    return;
                }
                const w = waves[waveIndex];
                soundFirework(w.pitch);
                const newParticles = createWave(w.cx, w.cy, w.count, w.speed, waveIndex * 10);
                allParticles = allParticles.concat(newParticles);
                waveIndex++;
                setTimeout(launchNextWave, 350);
            }

            function animateFireworks() {
                let alive = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                allParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.life -= 0.006;
                    if (p.life > 0) {
                        alive = true;
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                if (alive) {
                    requestAnimationFrame(animateFireworks);
                } else {
                    canvas.style.display = 'none';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    if (callback) callback();
                }
            }
            launchNextWave();
        }

        // ================================================================
        // 9. 最终结算 (计时停止，成就按新阈值)
        // ================================================================
        function showFinalMessage() {
            // 计时已暂停，最终累计时间为 accumulatedTime (毫秒)
            // 但可能还有未计入的零头，加上当前已暂停，无需再加
            totalSeconds = Math.floor(accumulatedTime / 1000);
            // 如果累计时间为0（可能是bug），用当前时间计算
            if (totalSeconds === 0 && gameStartTime) {
                totalSeconds = Math.floor((Date.now() - gameStartTime + accumulatedTime) / 1000);
            }

            // 新成就阈值
            let title = '';
            if (totalSeconds < 80) {
                title = '华兴的传奇';
            } else if (totalSeconds < 180) {
                title = '挺有实力嘛！';
            } else {
                title = '再接再厉！熟能生巧！';
            }

            gameFinished = true;
            soundVictory();

            const overlay = document.createElement('div');
            overlay.className = 'final-overlay';
            overlay.id = 'finalOverlay';

            overlay.innerHTML = `
                <div class="final-panel">
                    <h2>🏆 通关完成！</h2>
                    <div style="text-align:center;">
                        <span class="title-badge">${title}</span>
                    </div>
                    <div class="stats">
                        ⏱️ 总用时：<strong>${totalSeconds}</strong> 秒
                    </div>
                    <div class="signature-area">
                        <label>✍️ 手写签名（在下方画布上签名）</label>
                        <canvas id="signatureCanvas" width="300" height="150"></canvas>
                        <div class="signature-buttons">
                            <button class="btn btn-secondary" id="clearSigBtn">清除</button>
                            <button class="btn btn-success" id="saveSigBtn">✅ 确认签名</button>
                        </div>
                    </div>
                    <div class="leaderboard">
                        <h3>
                            <span>📋 排行榜</span>
                            <button class="clear-btn" id="clearLeaderboard">清空记录</button>
                        </h3>
                        <div class="leaderboard-list" id="leaderboardList"></div>
                    </div>
                    <div class="final-actions">
                        <button class="btn btn-secondary" id="backFromFinal">🏠 返回主界面</button>
                        <button class="btn btn-primary" id="restartFromFinal">🔄 再来一局</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            // ---------- 签名 ----------
            const sigCanvas = document.getElementById('signatureCanvas');
            const sigCtx = sigCanvas.getContext('2d');
            let isDrawing = false;
            let lastX = 0, lastY = 0;

            function startDraw(e) {
                e.preventDefault();
                isDrawing = true;
                const rect = sigCanvas.getBoundingClientRect();
                const scaleX = sigCanvas.width / rect.width;
                const scaleY = sigCanvas.height / rect.height;
                const touch = e.type === 'touchstart' ? e.touches[0] : e;
                lastX = (touch.clientX - rect.left) * scaleX;
                lastY = (touch.clientY - rect.top) * scaleY;
            }
            function draw(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const rect = sigCanvas.getBoundingClientRect();
                const scaleX = sigCanvas.width / rect.width;
                const scaleY = sigCanvas.height / rect.height;
                const touch = e.type === 'touchmove' ? e.touches[0] : e;
                const x = (touch.clientX - rect.left) * scaleX;
                const y = (touch.clientY - rect.top) * scaleY;
                sigCtx.beginPath();
                sigCtx.moveTo(lastX, lastY);
                sigCtx.lineTo(x, y);
                sigCtx.strokeStyle = '#1a2b4a';
                sigCtx.lineWidth = 3;
                sigCtx.lineCap = 'round';
                sigCtx.stroke();
                lastX = x;
                lastY = y;
            }
            function endDraw(e) { isDrawing = false; }

            sigCanvas.addEventListener('mousedown', startDraw);
            sigCanvas.addEventListener('mousemove', draw);
            sigCanvas.addEventListener('mouseup', endDraw);
            sigCanvas.addEventListener('mouseleave', endDraw);
            sigCanvas.addEventListener('touchstart', startDraw, { passive: false });
            sigCanvas.addEventListener('touchmove', draw, { passive: false });
            sigCanvas.addEventListener('touchend', endDraw, { passive: false });

            document.getElementById('clearSigBtn').addEventListener('click', function() {
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            });

            function saveSignature() {
                const imageData = sigCtx.getImageData(0, 0, sigCanvas.width, sigCanvas.height);
                let isBlank = true;
                for (let i = 3; i < imageData.data.length; i += 4) {
                    if (imageData.data[i] > 0) { isBlank = false; break; }
                }
                if (isBlank) {
                    alert('请先签名再确认！');
                    return;
                }
                const dataURL = sigCanvas.toDataURL('image/png');
                let records = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                records.push({
                    signature: dataURL,
                    time: totalSeconds,
                    title: title,
                    date: new Date().toLocaleString()
                });
                records.sort((a, b) => a.time - b.time);
                localStorage.setItem('leaderboard', JSON.stringify(records));
                renderLeaderboard();
                sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
                alert('✅ 签名已保存！');
            }

            document.getElementById('saveSigBtn').addEventListener('click', saveSignature);

            // ---------- 排行榜 ----------
            function renderLeaderboard() {
                const list = document.getElementById('leaderboardList');
                const records = JSON.parse(localStorage.getItem('leaderboard') || '[]');
                if (records.length === 0) {
                    list.innerHTML = '<div class="leaderboard-empty">暂无记录，快来挑战吧！</div>';
                    return;
                }
                list.innerHTML = records.map((rec, idx) => `
                    <div class="leaderboard-item">
                        <img src="${rec.signature}" alt="签名" class="signature-img">
                        <div class="info">
                            <div class="title">${rec.title}</div>
                            <div style="font-size:12px; color:#5c6f8c;">⏱️ ${rec.time}秒 · ${rec.date}</div>
                        </div>
                    </div>
                `).join('');
            }

            document.getElementById('clearLeaderboard').addEventListener('click', function() {
                if (confirm('确定清空所有记录吗？')) {
                    localStorage.removeItem('leaderboard');
                    renderLeaderboard();
                }
            });

            document.getElementById('backFromFinal').addEventListener('click', function() {
                overlay.remove();
                canvas.style.display = 'none';
                goToMainMenu();
            });

            document.getElementById('restartFromFinal').addEventListener('click', function() {
                overlay.remove();
                canvas.style.display = 'none';
                // 重新开始，重置计时
                accumulatedTime = 0;
                gameStartTime = Date.now();
                totalSeconds = 0;
                currentLevel = 0;
                resetLevel(0);
                nextBtn.disabled = true;
                gameFinished = false;
                message.textContent = '🔄 新开局，加油！';
                soundNext();
            });

            renderLeaderboard();
        }

        // ================================================================
        // 10. 界面切换绑定
        // ================================================================
        document.getElementById('startBtn').addEventListener('click', function() {
            mainMenu.classList.remove('active');
            levelSelect.classList.add('active');
        });

        document.getElementById('backFromSelect').addEventListener('click', goToMainMenu);

        document.getElementById('backFromGame').addEventListener('click', function() {
            if (confirm('确定要退出当前游戏吗？进度将丢失。')) {
                goToMainMenu();
            }
        });

        // ================================================================
        // 11. 初始化
        // ================================================================
        function init() {
            buildLevelSelect();
            mainMenu.classList.add('active');
            levelSelect.classList.remove('active');
            gameContainer.classList.remove('active');
            canvas.style.display = 'none';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
            resetLevel(0);
        }

        init();
    })();
</script>
